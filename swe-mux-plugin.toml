manifest_version = 1
id = "swemux-lab.session-switchboard"
name = "Session Switchboard"
version = "0.1.0"
min_swe_mux_version = "0.1.5"
description = "Project-scoped session control in a split terminal pane."
author = "swe-mux plugin lab"
license = "MIT"
platforms = ["windows", "linux", "macos"]
requires = ["plugin.actions.v1", "plugin.panes.v1"]
permissions = ["sessions.read", "terminal.write", "sessions.control", "plugins.self"]
runtime_requirements = ["python>=3.10"]

[[actions]]
id = "list"
title = "List Project sessions"
description = "Print a compact list of sessions belonging to the selected Project."
contexts = ["project"]
command = ["python", "session_switchboard.py", "--list"]
timeout_seconds = 30

[[panes]]
id = "switchboard"
title = "Session switchboard"
description = "Open a split-pane console for inspecting and explicitly controlling Project sessions."
contexts = ["project"]
placement = "split"
command = ["python", "session_switchboard.py"]

