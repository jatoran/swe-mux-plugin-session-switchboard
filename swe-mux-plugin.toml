manifest_version = 1
id = "swemux.official.session-switchboard"
name = "Session Switchboard"
version = "0.2.2"
min_swe_mux_version = "0.2.0"
description = "A compact Project session navigator and control panel."
author = "swe-mux"
license = "MIT"
homepage = "https://github.com/jatoran/swe-mux-plugin-session-switchboard"
platforms = ["windows", "linux", "macos"]
requires = ["plugin.actions.v1", "plugin.panes.v1"]
permissions = ["projects.read", "sessions.read", "terminal.write", "sessions.control", "plugins.self"]
runtime_requirements = ["python>=3.10"]

[[actions]]
id = "list"
title = "List Project sessions"
description = "Print a compact list of sessions belonging to the selected Project."
contexts = ["project"]
command = ["python", "session_switchboard.py", "--list"]
timeout_seconds = 30

[[panes]]
id = "switchboard"
title = "Session switchboard"
description = "Open a split Project tool for inspecting and explicitly controlling regular sessions."
contexts = ["project"]
placement = "split"
command = ["python", "session_switchboard.py"]

